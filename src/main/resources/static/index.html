<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Collaborative Dashboard</title>
    <link rel="stylesheet" href="/style.css"/>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📊%3C/text%3E%3C/svg%3E"/>
</head>
<body>
<header>
    <h1>Collaborative Drawing Dashboard</h1>
    <div class="header-right">
        <span id="current-user" class="user-pill"></span>
        <div id="status" class="status disconnected">disconnected</div>
    </div>
</header>

<section id="create-panel" class="panel hidden">
    <h2>Create a dashboard</h2>
    <form id="create-form">
        <label>Username <input type="text" name="username" id="create-username" required minlength="1" maxlength="32" pattern="[A-Za-z0-9 _.\-]+" placeholder="Your display name"/></label>
        <label>Width <input type="number" name="width" value="1280" min="100" max="8192" required/></label>
        <label>Height <input type="number" name="height" value="720" min="100" max="8192" required/></label>
        <button type="submit">Create</button>
    </form>
    <p id="create-error" class="error hidden"></p>
    <p class="hint">Or open an existing dashboard: <code>?id=&lt;uuid&gt;</code> in the URL.</p>
</section>

<section id="join-panel" class="panel hidden">
    <h2>Join dashboard</h2>
    <form id="join-form">
        <label>Username <input type="text" name="username" id="join-username" required minlength="1" maxlength="32" pattern="[A-Za-z0-9 _.\-]+" placeholder="Your display name"/></label>
        <button type="submit">Join</button>
    </form>
    <p id="join-error" class="error hidden"></p>
</section>

<section id="draw-panel" class="panel hidden">
    <div class="toolbar">
        <span>Dashboard: <code id="dashboard-id">-</code></span>
        <label>Color <input type="color" id="color" value="#2266cc"/></label>
        <label>Thickness <input type="range" id="thickness" min="1" max="12" value="3"/></label>
        <button id="copy-link">Copy share link</button>
        <button id="clear-btn" class="danger">Clear canvas</button>
        <button id="delete-btn" class="danger">Delete dashboard</button>
    </div>
    <div class="dashboard-layout">
        <aside id="users-panel">
            <h3>Active users</h3>
            <ul id="users-list"></ul>
        </aside>
        <canvas id="canvas"></canvas>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
