global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'collaborative-dashboard'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
    # Note: do NOT add an `application` target label here. The Spring Boot app
    # already attaches `application=<spring.application.name>` as a series label
    # via management.metrics.tags.application. A duplicate target label causes
    # Prometheus to rename the exposed one to `exported_application`, which
    # breaks third-party dashboards (4701, 11378) that filter on `application`.
