<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Collaborative Dashboard</title>
    <link rel="stylesheet" href="/style.css"/>
</head>
<body>
<header>
    <h1>Collaborative Drawing Dashboard</h1>
    <div class="header-right">
        <span id="current-user" class="user-pill"></span>
        <div id="status" class="status disconnected">disconnected</div>
    </div>
</header>

<section id="create-panel" class="panel hidden">
    <h2>Create a dashboard</h2>
    <form id="create-form">
        <label>Width <input type="number" name="width" value="1280" min="100" max="8192" required/></label>
        <label>Height <input type="number" name="height" value="720" min="100" max="8192" required/></label>
        <button type="submit">Create</button>
    </form>
    <p class="hint">Or open an existing dashboard: <code>?id=&lt;uuid&gt;</code> in the URL.</p>
</section>

<section id="draw-panel" class="panel hidden">
    <div class="toolbar">
        <span>Dashboard: <code id="dashboard-id">-</code></span>
        <label>Color <input type="color" id="color" value="#2266cc"/></label>
        <label>Thickness <input type="range" id="thickness" min="1" max="12" value="3"/></label>
        <button id="copy-link">Copy share link</button>
        <button id="clear-btn" class="danger">Clear canvas</button>
        <button id="delete-btn" class="danger">Delete dashboard</button>
    </div>
    <canvas id="canvas"></canvas>
</section>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
